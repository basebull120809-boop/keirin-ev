name: probe（取得テスト）
on:
  workflow_dispatch:
  push:
    paths: ["keirin_ev/kdreams.py", ".github/workflows/probe.yml"]
concurrency: { group: data, cancel-in-progress: false }
permissions: { contents: write }
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env: { TZ: Asia/Tokyo, KEIRIN_CACHE: debug/html, PYTHONUNBUFFERED: "1" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip }
      - run: pip install -r requirements.txt
      - run: |
          rm -rf debug && mkdir -p debug
          python main.py probe 2>&1 | tee debug/probe_log.txt
      - name: 結果を保存
        run: |
          git config user.name "keirin-bot"; git config user.email "bot@users.noreply.github.com"
          git add debug
          git commit -m "probe結果 $(date +%F_%H%M)" || exit 0
          git pull --rebase && git push
