name: probe-sources（ほかの競輪サイトの調査）
on:
  workflow_dispatch:
  push:
    branches: ["claude/**"]
    paths: [".github/workflows/probe-sources.yml", "keirin_ev/sources.py"]
permissions: { contents: write }
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env: { TZ: Asia/Tokyo, PYTHONUNBUFFERED: "1" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip }
      - run: pip install -r requirements.txt
      - run: |
          mkdir -p debug/sources
          python -c "from keirin_ev.sources import deep; deep()" 2>&1 | tee debug/sources/deep_log.txt
      - name: 結果を保存（このブランチに）
        run: |
          git config user.name "keirin-bot"; git config user.email "bot@users.noreply.github.com"
          git add debug/sources
          git commit -m "probe-sources $(date +%F_%H%M)" || exit 0
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
