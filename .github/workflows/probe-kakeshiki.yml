name: probe-kakeshiki（券種の調査・一時的）
on:
  push:
    branches: ["claude/multi-bet"]
    paths: ["tools/probe_kakeshiki.py", ".github/workflows/probe-kakeshiki.yml"]
permissions: { contents: write }
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env: { TZ: Asia/Tokyo, KEIRIN_CACHE: /tmp/html, PYTHONUNBUFFERED: "1" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip }
      - run: pip install -r requirements.txt
      - run: python tools/probe_kakeshiki.py
      - name: 結果を保存
        run: |
          git config user.name "keirin-bot"; git config user.email "bot@users.noreply.github.com"
          git add debug
          git commit -m "券種の調査結果" || exit 0
          git push
