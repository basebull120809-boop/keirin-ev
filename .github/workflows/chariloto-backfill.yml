name: chariloto-backfill（チャリロトの記者予想を過去分から取得）
on:
  workflow_dispatch:
    inputs:
      days: { description: "1回に取る日数", default: "30" }
  push:
    branches: ["claude/**"]
    paths: [".github/workflows/chariloto-backfill.yml", "keirin_ev/chariloto.py"]
permissions: { contents: write }
concurrency: { group: chariloto-backfill, cancel-in-progress: false }
jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env: { TZ: Asia/Tokyo, PYTHONUNBUFFERED: "1" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip }
      - run: pip install -r requirements.txt
      - run: |
          mkdir -p debug
          python main.py crbackfill "${{ github.event.inputs.days || '3' }}" 2>&1 | tee debug/chariloto_log.txt
      - name: 保存（このブランチに）
        run: |
          git config user.name "keirin-bot"; git config user.email "bot@users.noreply.github.com"
          git add data/daily debug/chariloto_log.txt
          git commit -m "chariloto-backfill $(date +%F_%H%M)" || exit 0
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
