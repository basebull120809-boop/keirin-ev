name: netkeirin-asof（時点集計の確認）
on:
  workflow_dispatch:
  push:
    branches: ["claude/**"]
    paths: [".github/workflows/netkeirin-asof.yml"]
permissions: { contents: write }
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env: { TZ: Asia/Tokyo, NETKEIRIN_CACHE: /tmp/html_nk, PYTHONUNBUFFERED: "1" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip }
      - run: pip install -r requirements.txt
      - run: |
          mkdir -p debug/netkeirin
          python main.py nkasof 2>&1 | tee debug/netkeirin/asof_log.txt
      - name: 結果を保存（このブランチに）
        run: |
          git config user.name "keirin-bot"; git config user.email "bot@users.noreply.github.com"
          git add debug/netkeirin
          git commit -m "netkeirin-asof $(date +%F_%H%M)" || exit 0
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
