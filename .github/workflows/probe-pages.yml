name: probe-pages（独自データのタブ調査）
on:
  workflow_dispatch:
  push:
    branches: ["claude/**"]
    paths: [".github/workflows/probe-pages.yml", "keirin_ev/kdreams.py"]
permissions: { contents: write }
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env: { TZ: Asia/Tokyo, KEIRIN_CACHE: /tmp/html, PYTHONUNBUFFERED: "1" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip }
      - run: pip install -r requirements.txt
      - run: |
          mkdir -p debug/pages
          python main.py probepages "$(date -d yesterday +%F)" 2>&1 | tee debug/pages/log.txt
      - name: 結果を保存（このブランチに）
        run: |
          git config user.name "keirin-bot"; git config user.email "bot@users.noreply.github.com"
          git add debug/pages
          git commit -m "probe-pages $(date +%F_%H%M)" || exit 0
          git pull --rebase && git push
