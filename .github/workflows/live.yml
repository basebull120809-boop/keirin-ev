name: live（当日の締切前判定と通知）
on:
  schedule:
    # 08:00〜23:30 JST に30分ごと起動。動いている間は1本だけ待機し、終わりしだい引き継ぐ
    # （GitHubの定時起動は遅れたり抜けたりするので、1日3回だと判定が数時間止まることがある）
    - { cron: "*/30 23,0-14 * * *" }
  workflow_dispatch:
    inputs:
      minutes: { description: "動かす分数（テストは15など）", required: false, default: "340" }
concurrency: { group: live, cancel-in-progress: false }
permissions: { contents: write, issues: write }
jobs:
  live:
    # 非公開リポジトリでは無料枠を使い切るため、自動起動は公開リポジトリのときだけ
    if: ${{ github.event_name == 'workflow_dispatch' || !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env: { TZ: Asia/Tokyo, PYTHONUNBUFFERED: "1", GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip }
      - run: pip install -r requirements.txt
      - run: python main.py live "${{ inputs.minutes || '340' }}"
      - name: 記録を保存
        if: always()
        run: |
          git config user.name "keirin-bot"; git config user.email "bot@users.noreply.github.com"
          python -c "from keirin_ev.site import export_live; export_live()" || true
          git add data/live site
          git commit -m "live $(date +%F_%H%M)" || exit 0
          for i in 1 2 3; do git pull --rebase -X theirs && git push && break; sleep 5; done
