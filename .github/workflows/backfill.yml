name: backfill（過去データの遡り取得）
on:
  schedule: [{ cron: "10 4,10 * * *" }]   # 毎日 13:10 / 19:10 JST
  workflow_dispatch:
    inputs:
      days: { description: "1回で遡る日数", required: false, default: "3" }
env:
  OLDEST: "2024-11-01"                       # ここまで遡ったら止まる
concurrency: { group: data, cancel-in-progress: false }
permissions: { contents: write }
jobs:
  backfill:
    if: ${{ vars.BACKFILL_ON == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env: { TZ: Asia/Tokyo, PYTHONUNBUFFERED: "1" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip }
      - run: pip install -r requirements.txt
      - run: python main.py backfill "${{ inputs.days || '3' }}" "$OLDEST" 2>&1 | tail -300
      - name: 保存
        run: |
          git config user.name "keirin-bot"; git config user.email "bot@users.noreply.github.com"
          git add data/daily
          git commit -m "backfill $(date +%F_%H%M)" || exit 0
          git pull --rebase && git push
