name: backfill（過去データの遡り取得）
on:
  schedule: [{ cron: "10 4,10 * * *" }]   # 毎日 13:10 / 19:10 JST
  workflow_dispatch:
    inputs:
      days: { description: "1回で遡る日数", required: false, default: "7" }
env:
  OLDEST: "2024-11-01"                       # ここまで遡ったら止まる
concurrency: { group: data, cancel-in-progress: false }
permissions: { contents: write }
jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env: { TZ: Asia/Tokyo, PYTHONUNBUFFERED: "1" }
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip }
      - run: pip install -r requirements.txt
      - name: 1日ずつ取得して保存
        run: |
          git config user.name "keirin-bot"; git config user.email "bot@users.noreply.github.com"
          for n in $(seq 1 ${{ inputs.days || '7' }}); do
            git pull -q --rebase -X theirs || true
            python main.py backfill 1 "$OLDEST" 2>&1 | tail -40
            git add data/daily
            git commit -qm "backfill $(date +%F_%H%M)" || break
            for i in 1 2 3; do git pull -q --rebase -X theirs && git push -q && break; sleep 5; done
          done
