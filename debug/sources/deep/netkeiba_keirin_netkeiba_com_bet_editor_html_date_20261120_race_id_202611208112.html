$(function() {
$('#act-clear').on('click', function() {
if (confirm("\nブラウザのストレージを削除してよろしいですか？\n")) {
store.clearAll();
window.location.href = '';
}
});
});
function Scroll_Top() {
$('body,html').animate({scrollTop:0}, 400, 'swing');
return false;
}
// ストレージ削除対応
var now = new Date().getTime();
Object.keys(localStorage).forEach(function (key) {
//買い目のキー以外が処理しない
if(!key.match(/^ndi::bet_/)){
return;
}
var val = localStorage.getItem(key);
try {
const ls_obj = JSON.parse(val);
if(ls_obj.uptime){
//時間の判定して条件のあったデータを消す
let expire_day = 7; // 7日間は保持しておく
let data_expire = expire_day * 24 * 60 * 60;
let uptime = new Date(ls_obj.uptime).getTime();
let expire = uptime + data_expire * 1000;
if(now >= expire){
localStorage.removeItem(key);
}
}
} catch (error) {
console.log(error);
}
});
// ストレージ削除対応ここまで
